<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a9bff"/>
      <stop offset="55%" stop-color="#0067c0"/>
      <stop offset="100%" stop-color="#00489c"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7be495"/>
      <stop offset="100%" stop-color="#22b24c"/>
    </linearGradient>
    <linearGradient id="orange" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffc36b"/>
      <stop offset="100%" stop-color="#f2860f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- subtle top sheen for a Fluent-style soft highlight -->
