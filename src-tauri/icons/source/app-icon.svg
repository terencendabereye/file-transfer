  <!-- two parallel right-pointing arrows: two independent transfer streams -->
  <g>
    <rect x="271" y="332" width="330" height="80" rx="40" fill="url(#green)"/>
    <path d="M 753 372 L 601 222 L 601 522 Z" fill="url(#green)"/>

    <rect x="423" y="612" width="330" height="80" rx="40" fill="url(#orange)"/>
